<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미친 놈 신고 센터</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #d9534f;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        .result-message {
            display: none;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 입력 화면 -->
    <div id="reportForm">
        <h1>🚨 미친 놈 신고 센터</h1>
        <div class="form-group">
            <label>이름</label>
            <input type="text" placeholder="이름을 입력하세요">
        </div>
        <div class="form-group">
            <label>생년월일</label>
            <input type="date">
        </div>
        <button type="button" onclick="submitReport()">신고 접수</button>
    </div>

    <!-- 결과 화면 -->
    <div id="resultMessage" class="result-message">
        신고 감사합니다<br>빨리 처리하도록 하겠습니다
    </div>
</div>

<script>
    function submitReport() {
        // 빈칸 검사 없이 바로 화면 전환
        document.getElementById('reportForm').style.display = 'none';
        document.getElementById('resultMessage').style.display = 'block';
    }
</script>

</body>
</html>
